server {
    listen 8080;
    server_name _;

    # Não expõe a versão do nginx (cabeçalho Server e páginas de erro).
    server_tokens off;
    # Redirecionamentos relativos (sem a porta interna 8080 no Location).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança da SPA (X-Content-Type-Options, X-Frame-Options, Referrer-Policy).
    # Ficam repetidos nos locations estáticos (/assets/, = /index.html e /) porque add_header não é
    # herdado quando o location define o seu — e NÃO vão no server, para não chegarem a /api/
    # (o backend já envia os dele; não duplicar).

    # DNS interno do Docker; com o proxy_pass em variável o nginx re-resolve "backend" a cada
    # 10 s, então recriar só o backend (novo IP) não causa 502 permanente.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: repassa para o backend. Como o proxy_pass usa variável e não tem URI, a URI original
    # (com o prefixo /api) é repassada inteira.
    location /api/ {
        set $destino_backend http://backend:8080;
        proxy_pass $destino_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Arquivos com hash no nome: cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html nunca em cache, para o navegador pegar sempre a versão nova dos assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fallback da SPA (React Router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
