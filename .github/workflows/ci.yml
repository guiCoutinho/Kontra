name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um build por ref: um push novo cancela o anterior ainda em andamento (exceto na main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# As actions ficam fixadas por SHA do commit (supply chain); a versão está no comentário.
jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitários (*Test) + integração (*IT, Testcontainers com PostgreSQL real; o Docker já vem no runner).
      - name: Build e testes
        run: ./mvnw -B -ntp verify

      # O snapshot do OpenAPI não pode mudar durante o build: pega snapshot desatualizado ou regravado.
      # (git diff não enxerga arquivos novos não rastreados; o status cobre esse caso.)
      - name: Snapshot do OpenAPI inalterado
        run: |
          git diff --exit-code -- openapi/openapi.json
          if [ -n "$(git status --porcelain -- openapi)" ]; then
            git status --porcelain -- openapi
            echo "::error::O diretório openapi/ mudou durante o build"
            exit 1
          fi

      - name: Relatórios de testes (em falha)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorios-testes-backend
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + testes + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

      # O cliente gerado é versionado: regenerar a partir do snapshot não pode alterar nada
      # (git diff não enxerga arquivos novos não rastreados; o status cobre esse caso).
      - name: Cliente da API gerado atualizado
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            git status --porcelain -- src/api/generated
            echo "::error::src/api/generated mudou após generate:api"
            exit 1
          fi

  e2e:
    name: e2e (Playwright contra o docker compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem .env: o compose usa os padrões de desenvolvimento. Sobe banco + backend + frontend
      # e espera os três ficarem saudáveis (o build das imagens roda aqui).
      - name: Subir a stack
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependências do e2e
        working-directory: e2e
        run: npm ci

      - name: Checagem de tipos do e2e
        working-directory: e2e
        run: npm run typecheck

      - name: Versão do Playwright (chave do cache)
        id: playwright
        run: echo "versao=$(jq -r '.packages["node_modules/@playwright/test"].version' e2e/package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Cache dos navegadores do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}

      # Mesmo com o cache do navegador, as bibliotecas do sistema (--with-deps) continuam necessárias.
      - name: Instalar o Chromium do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Testes e2e
        working-directory: e2e
        env:
          # 127.0.0.1 (IPv4): as portas do compose só existem em IPv4; evita tentativa por ::1.
          URL_BASE_E2E: http://127.0.0.1:3000
        run: npx playwright test

      - name: Estado e logs do compose (em falha)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color | tee e2e/compose.log

      - name: Relatório do Playwright e logs (em falha)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-playwright
          path: |
            e2e/playwright-report
            e2e/compose.log
          if-no-files-found: ignore

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
